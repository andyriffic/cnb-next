<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-labelledby="title desc">
  <title id="title">Front-facing dog catcher</title>
  <desc id="desc">A cheerful comic-style dog catcher in a red uniform, holding a net.</desc>
  <style>
    .ink { stroke: #3d2b25; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .uniform { fill: var(--uniform-red, #d94f42); }
  </style>
  <defs>
    <clipPath id="netClip"><ellipse cx="67" cy="18.5" rx="9.5" ry="12"/></clipPath>
  </defs>
  <!-- Net and handle behind the catcher -->
  <path d="M62 29 L51 52" fill="none" stroke="#3d2b25" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M62 29 L51 52" fill="none" stroke="#bd8c58" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="67" cy="18.5" rx="9.5" ry="12" fill="#fff0d8" stroke="#3d2b25" stroke-width="2.5"/>
  <g clip-path="url(#netClip)" fill="none" stroke="#b88c67" stroke-width="1">
    <path d="M55 8 L77 29 M55 15 L72 31 M61 5 L78 20 M57 25 L75 10 M62 31 L77 13"/>
    <path d="M60 5 V32 M67 5 V32 M74 5 V32 M54 13 H79 M54 20 H79 M55 27 H78"/>
  </g>
  <!-- Body and legs -->
  <path class="uniform ink" d="M28 42 H52 Q58 43 60 51 L63 72 H17 L20 52 Q21 44 28 42Z"/>
  <path d="M40 57 V71" fill="none" stroke="#9f3933" stroke-width="1.5" stroke-linecap="round"/>
