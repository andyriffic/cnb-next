  <circle cx="40" cy="14.2" r="1.2" fill="#a63834"/>
  <circle cx="37.9" cy="12.4" r="0.7" fill="#a63834"/>
  <circle cx="39.4" cy="11.5" r="0.7" fill="#a63834"/>
  <circle cx="41" cy="11.5" r="0.7" fill="#a63834"/>
  <circle cx="42.3" cy="12.4" r="0.7" fill="#a63834"/>
