name: business-hours-scheduler
run-name: Business hours check
on:
  schedule:
    # Runs hourly. A fixed UTC cron can't express "9am-5pm Sydney time"
    # year-round because Sydney's UTC offset changes with daylight saving —
    # checking the real Sydney wall-clock time at runtime sidesteps that
    # entirely. Minute 7 (not 0) avoids the top-of-hour congestion that
    # commonly delays GitHub's scheduled runs.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  actions: write
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reconcile actual stack state against business hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          day=$(TZ='Australia/Sydney' date +%u)   # 1=Mon .. 7=Sun
          hour=$(TZ='Australia/Sydney' date +%H)
          echo "Sydney day=$day hour=$hour"

          desired="down"
          if [[ "$day" =~ ^(1|2|4|5)$ ]] && [ "$hour" -ge 6 ] && [ "$hour" -lt 17 ]; then
            desired="up"
          fi
          echo "Desired state: $desired"

          status=$(aws cloudformation describe-stacks --stack-name CnbNextProdStack \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")
          echo "Stack status: $status"

          case "$status" in
            NOT_FOUND)
              actual="down"
              ;;
            *_IN_PROGRESS)
              echo "Stack operation already in progress ($status) — skipping this cycle, will re-check next hour."
              exit 0
              ;;
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE|IMPORT_ROLLBACK_COMPLETE)
              actual="up"
              ;;
            *)
              echo "Stack in unexpected state ($status) — skipping, this needs manual attention."
              exit 0
              ;;
          esac
          echo "Actual state: $actual"

          if [ "$desired" = "up" ] && [ "$actual" = "down" ]; then
            echo "Should be up but isn't — triggering deploy-prod-cdk"
            gh workflow run deploy-prod-cdk.yml --ref main --repo "${{ github.repository }}"
          elif [ "$desired" = "down" ] && [ "$actual" = "up" ]; then
            echo "Should be down but is up — triggering destroy-prod-cdk"
            gh workflow run destroy-prod-cdk.yml --ref main --repo "${{ github.repository }}"
          else
            echo "Already in desired state ($desired) — nothing to do."
          fi
