name: deploy-prod-cdk
run-name: Deploy prod (with domain) via CDK
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 26 matches the Dockerfile's node:26.5-alpine base image and
      # satisfies aws-cdk-lib's minimum (>=20), so one install covers both
      # the app's own scripts and the cdk/ app.
      - uses: actions/setup-node@v3
        with:
          node-version: "26"

      - run: npm install
      - run: npm run typecheck

      - run: npm install
        working-directory: cdk

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy stack (with domain)
        working-directory: cdk
        env:
          DOMAIN_NAME: cnb.finx-rocks.com
          HOSTED_ZONE_NAME: finx-rocks.com
          HOSTED_ZONE_ID: Z3H2KCS6G4PEXD
        run: |
          export DYNAMO_DB_ACCESS_KEY=$(aws ssm get-parameter --name "/cnb-next/prod/DYNAMO_DB_ACCESS_KEY" --with-decryption --query "Parameter.Value" --output text)
          export DYNAMO_DB_ACCESS_KEY_SECRET=$(aws ssm get-parameter --name "/cnb-next/prod/DYNAMO_DB_ACCESS_KEY_SECRET" --with-decryption --query "Parameter.Value" --output text)
          npx cdk deploy --require-approval never
